import org.gradle.api.tasks.testing.Test
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JavaToolchainService

allprojects {
    plugins.withId('java') {
        def toolchains = extensions.getByType(JavaToolchainService)
        tasks.withType(Test).configureEach {
            if (name == 'quackPreviewTest') {
                javaLauncher.set(toolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) })
                doFirst { println('Direct Java Quack test runtime: ' + javaLauncher.get().metadata.installationPath) }
            }
        }
    }
}
